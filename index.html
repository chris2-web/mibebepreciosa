<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Para ti</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;1,400;1,600&family=Caveat:wght@500&display=swap" rel="stylesheet">
<style>
:root{--bg:#2a1636;--txt:#f6e9ee;--acc:#f0a8b8;--paper:#fbf1f0;--ink:#3b2142;--env:#d9b7c0;--flap:#e8c9d1;--mut:#b9a2c2;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--txt);font-family:"Fraunces",Georgia,serif;line-height:1.55;min-height:100vh}
main{max-width:34rem;margin:0 auto;padding:2rem 1.4rem 4rem}
h1{font-weight:600;font-style:italic;font-size:2rem;line-height:1.15;margin:.2rem 0 .6rem}
.intro{color:var(--mut);margin:0 0 1.8rem}
.tiles{display:flex;gap:.7rem;margin-bottom:2.2rem}
.tile{flex:1;font:inherit;font-size:.95rem;color:var(--mut);background:none;border:1.5px dashed var(--mut);border-radius:.6rem;padding:.8rem .4rem;cursor:default}
.tile.on{color:var(--ink);background:var(--acc);border:1.5px solid var(--acc);cursor:pointer}
.tile:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid var(--acc);outline-offset:3px}
.q{font-style:italic;font-size:1.55rem;line-height:1.3;margin:0 0 1.2rem}
input{width:100%;font:inherit;font-size:1.2rem;color:var(--txt);background:none;border:0;border-bottom:2px solid var(--acc);padding:.5rem 0;border-radius:0}
.btn{font:inherit;font-weight:600;font-size:1.05rem;color:var(--ink);background:var(--acc);border:0;border-radius:2rem;padding:.8rem 1.8rem;margin-top:1.4rem;cursor:pointer}
.msg{min-height:3.2em;margin:.9rem 0 0;color:var(--acc)}
.shake{animation:sh .4s}
@keyframes sh{20%{transform:translateX(-8px)}50%{transform:translateX(8px)}80%{transform:translateX(-4px)}}
.env{position:relative;width:min(80vw,300px);height:190px;margin:0 auto 1.6rem;background:var(--env);border-radius:.4rem}
.env::after{content:"";position:absolute;inset:0;background:#e2c3cb;clip-path:polygon(0 100%,50% 40%,100% 100%);border-radius:.4rem}
.flap{position:absolute;left:0;right:0;top:0;height:60%;background:var(--flap);clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;transition:transform .9s ease;z-index:2}
.seal{position:absolute;left:50%;top:50%;width:2.6rem;height:2.6rem;margin:-1.3rem 0 0 -1.3rem;border-radius:50%;background:#b83a5a;color:#fff;display:grid;place-items:center;z-index:3;transition:opacity .4s}
.env.open .flap{transform:rotateX(180deg);z-index:0}
.env.open .seal{opacity:0}
.letter{background:var(--paper);color:var(--ink);border-radius:.4rem;padding:1.6rem 1.4rem;font-family:"Caveat","Segoe Script",cursive;font-size:1.5rem;line-height:1.45;animation:up .8s both}
.letter h2{font-family:"Fraunces",Georgia,serif;font-style:italic;font-size:1.25rem;margin:0 0 1rem}
.letter p{margin:0 0 .9rem}
.sig{text-align:right;margin-top:1.2rem!important}
@keyframes up{from{opacity:0;transform:translateY(18px)}}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main>
  <h1 id="titulo"></h1>
  <p class="intro" id="intro"></p>
  <div class="tiles" id="tiles"></div>
  <section id="pregunta">
    <p class="q" id="q"></p>
    <input id="resp" type="text" autocomplete="off" autocapitalize="off" aria-label="Tu respuesta">
    <p class="msg" id="msg" role="status"></p>
    <button class="btn" id="ok">Abrir carta</button>
  </section>
  <section id="carta" hidden>
    <div class="env" id="env"><div class="flap"></div><div class="seal">&#9829;</div></div>
    <article class="letter" id="letter" hidden></article>
    <button class="btn" id="sig" hidden></button>
  </section>
  <section id="fin" hidden>
    <p class="q" id="finTxt"></p>
  </section>
</main>
<script>
/* ====== EDITA AQUÍ: preguntas, respuestas y cartas ====== */
const C = {
  titulo: "Tres preguntas, tres cartas",
  intro: "Responde cada pregunta. Si aciertas, se abre una carta para ti.",
  rondas: [
    { q: "¿Que me gusta mas?",
      resp: ["tu novia"],                       // palabras que acepta como correctas
      pista: "la ves absolutamente todos los doas.",
      titulo: "Primera carta",
      texto: ["Mi amor,", "quiero decirte que te amo por como eres por la increible mujer que eres y porque en ti veo una madre perfecta para nuestros hijos y una mujer perfecta para pasar el resto de mis dias. cada vez que veo tus fotos me enamoro mas de ti y de tu perfección cada vez que te conozco por cada dia que pasa me hace amarte mas y ese es mi porque", "],
      firma: "Tuyo, siempre" },
    { q: "¿cual es mi comida favorita?",
      resp: ["pasticho"],
      pista: "Se comparte en porciones.",
      titulo: "Segunda carta",
      texto: ["Mi vida,", "en este aniversario de mes sigo admirando la capacidad que ambos tenemos en resolver nuestros conflictos aunque sintamos que estamos al borde de que todo se termine, aunque no sea tan expresivo en algunas ocasiones me encanta saber que solo contigo me puedo expresar sin limitaciones, quiero seguir enamorado de ti y haciéndo mas cosas asi.", "quiero seguir siendo tu novio porque admiro tu inteligencia quiero llegar a ser tu esposo y decir mi esposa es la mejor arquitecta del pais, porque tengo fe en que asi sera"],
      firma: "Tuyo, siempre" },
    { q: "¿a que le tengo miedo?",
      resp: ["mariposas"],
      pista: "no es tanto miedo mas q todo es asco.",
      titulo: "Tercera carta",
      texto: ["Amor de mi vida,", "lo mas precioso de la naturaleza eres tu y se que lo seguiras siendo y me siento afortunado de tener casi dos años contigo, de los que no quiero que terminen nunca, la más especial y el tulipán mas precioso del jardin asi eres tu tus ojos de amanecer y la piel mas perfecta que han visto mis ojos.", "sigo prometiendo en mejorar para los dos para no seguir haciéndonos daños, un daño que pueda escalar a mayor, te amo con mi vida no quiero perderte nunca, no quiero que os perdamos jamás, solo quiero perderme en el aroma de tu cabello y en tus preciosos ojos pero en nada mas que no sea solo en ti, totalmente perdido en ti vuelto loco y sin cabeza por tu amor ."],
      firma: "Tuyo, siempre" }
  ],
  final: "Ya abriste las tres cartas. Gracias por ser tú, gracias oor estar conmigo y por ser la mas preciosa conmigo aunque a veces yo no sea el mejor novio, te amo, quieres seguir siendo mi novia?."
};
/* ======================================================== */

const $ = id => document.getElementById(id);
const norm = s => s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9]+/g, " ").trim();
const esc = s => s.replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
let done = 0, fails = 0, viewing = -1;
try { done = Math.min(+localStorage.getItem("cartas") || 0, C.rondas.length); } catch (e) {}

$("titulo").textContent = C.titulo;
$("intro").textContent = C.intro;

function show(sec) {
  ["pregunta", "carta", "fin"].forEach(id => $(id).hidden = id !== sec);
}

function tiles() {
  $("tiles").innerHTML = "";
  C.rondas.forEach((r, k) => {
    const b = document.createElement("button");
    b.className = "tile" + (k < done ? " on" : "");
    b.textContent = k < done ? "Carta " + (k + 1) : "Sellada";
    b.disabled = k >= done;
    b.onclick = () => openLetter(k, false);
    $("tiles").appendChild(b);
  });
}

function next() {
  tiles();
  fails = 0;
  $("msg").textContent = "";
  $("resp").value = "";
  if (done >= C.rondas.length) { $("finTxt").textContent = C.final; show("fin"); return; }
  $("q").textContent = C.rondas[done].q;
  show("pregunta");
}

function openLetter(k, animate) {
  const r = C.rondas[k];
  viewing = k;
  $("letter").hidden = true;
  $("sig").hidden = true;
  $("env").classList.remove("open");
  $("letter").innerHTML = "<h2>" + esc(r.titulo) + "</h2>" + r.texto.map(t => "<p>" + esc(t) + "</p>").join("") + '<p class="sig">' + esc(r.firma) + "</p>";
  $("sig").textContent = k === done - 1 && done < C.rondas.length ? "Siguiente pregunta" : (done >= C.rondas.length ? "Cerrar" : "Volver");
  show("carta");
  const reveal = () => { $("letter").hidden = false; $("sig").hidden = false; $("letter").scrollIntoView({ behavior: still ? "auto" : "smooth", block: "start" }); };
  if (!animate || still) { $("env").classList.add("open"); reveal(); return; }
  setTimeout(() => $("env").classList.add("open"), 60);
  setTimeout(reveal, 1100);
}

function check() {
  const r = C.rondas[done];
  const v = norm($("resp").value);
  if (v && r.resp.some(a => v.includes(norm(a)))) {
    done++;
    try { localStorage.setItem("cartas", done); } catch (e) {}
    tiles();
    openLetter(done - 1, true);
  } else {
    fails++;
    $("msg").textContent = fails > 1 && r.pista ? "Todavía no. Pista: " + r.pista : "Esa no es. Inténtalo otra vez.";
    $("resp").classList.remove("shake");
    void $("resp").offsetWidth;
    $("resp").classList.add("shake");
  }
}

$("ok").onclick = check;
$("resp").addEventListener("keydown", e => { if (e.key === "Enter") check(); });
$("sig").onclick = () => { window.scrollTo(0, 0); next(); };
next();
</script>
</body>
</html>
