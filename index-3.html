<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Te Amo en 200 Idiomas 💖</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --pink: #ff6eb4;
    --hotpink: #ff3d9a;
    --purple: #c96dff;
    --yellow: #ffe066;
    --sky: #7ee8fa;
    --mint: #6fffc1;
    --orange: #ffb347;
    --bg: #fff5fb;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background-color: var(--bg);
    font-family: 'Nunito', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
    background-image:
      radial-gradient(circle at 10% 20%, rgba(255,110,180,0.12) 0%, transparent 40%),
      radial-gradient(circle at 90% 80%, rgba(201,109,255,0.12) 0%, transparent 40%),
      radial-gradient(circle at 50% 50%, rgba(126,232,250,0.08) 0%, transparent 60%);
  }

  /* ——— HEADER ——— */
  header {
    text-align: center;
    padding: 40px 20px 10px;
  }

  header h1 {
    font-family: 'Fredoka One', sans-serif;
    font-size: clamp(2.2rem, 6vw, 4.5rem);
    color: var(--hotpink);
    text-shadow: 3px 3px 0 var(--purple), 5px 5px 0 rgba(255,110,180,0.3);
    letter-spacing: 2px;
    line-height: 1.2;
    animation: wobble 3s ease-in-out infinite;
  }

  header p {
    font-family: 'Nunito', sans-serif;
    font-weight: 700;
    color: var(--purple);
    font-size: 1.2rem;
    margin-top: 8px;
  }

  @keyframes wobble {
    0%,100% { transform: rotate(-1deg); }
    50%      { transform: rotate(1.5deg); }
  }

  /* ——— BUTTON ——— */
  .btn-wrap {
    text-align: center;
    margin: 18px 0 6px;
    position: relative;
    z-index: 10;
  }

  #dino-btn {
    font-family: 'Fredoka One', sans-serif;
    font-size: 1.25rem;
    background: linear-gradient(135deg, #ff6eb4, #c96dff);
    color: white;
    border: none;
    border-radius: 50px;
    padding: 14px 32px;
    cursor: pointer;
    box-shadow: 0 5px 0 #a040cc, 0 8px 18px rgba(201,109,255,0.3);
    transition: transform 0.12s, box-shadow 0.12s;
    letter-spacing: 1px;
  }

  #dino-btn:hover {
    transform: translateY(-3px);
    box-shadow: 0 8px 0 #a040cc, 0 12px 24px rgba(201,109,255,0.4);
  }

  #dino-btn:active {
    transform: translateY(3px);
    box-shadow: 0 2px 0 #a040cc;
  }

  /* ——— POPUP ——— */
  #popup-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(255,200,230,0.45);
    backdrop-filter: blur(4px);
    z-index: 100;
    justify-content: center;
    align-items: center;
    animation: fadeIn 0.2s ease;
  }

  #popup-overlay.show { display: flex; }

  @keyframes fadeIn {
    from { opacity: 0; } to { opacity: 1; }
  }

  #popup-box {
    background: white;
    border-radius: 28px;
    padding: 32px 28px 24px;
    text-align: center;
    max-width: 440px;
    width: 92%;
    box-shadow: 0 8px 0 #e080c0, 0 16px 40px rgba(255,62,154,0.2);
    border: 3px solid var(--pink);
    position: relative;
    animation: popIn 0.35s cubic-bezier(0.34,1.56,0.64,1);
  }

  @keyframes popIn {
    from { transform: scale(0.3) rotate(-8deg); opacity: 0; }
    to   { transform: scale(1)   rotate(0deg);  opacity: 1; }
  }

  #popup-box svg {
    width: 260px;
    height: 170px;
    display: block;
    margin: 0 auto 10px;
    animation: dinoWobble 1.2s ease-in-out infinite;
    filter: drop-shadow(3px 4px 0 rgba(0,0,0,0.1));
  }

  @keyframes dinoWobble {
    0%,100% { transform: rotate(-2deg) translateY(0);   }
    50%      { transform: rotate(2deg)  translateY(-8px); }
  }

  #popup-box .popup-title {
    font-family: 'Fredoka One', sans-serif;
    font-size: 1.5rem;
    color: var(--hotpink);
    margin-bottom: 6px;
  }

  #popup-box .popup-sub {
    font-family: 'Nunito', sans-serif;
    font-size: 0.95rem;
    color: var(--purple);
    font-weight: 700;
    margin-bottom: 18px;
  }

  #close-popup {
    font-family: 'Fredoka One', sans-serif;
    font-size: 1rem;
    background: linear-gradient(135deg, #ff6eb4, #ffb347);
    color: white;
    border: none;
    border-radius: 50px;
    padding: 10px 28px;
    cursor: pointer;
    box-shadow: 0 4px 0 #cc5000;
    transition: transform 0.1s, box-shadow 0.1s;
  }

  #close-popup:active {
    transform: translateY(3px);
    box-shadow: 0 1px 0 #cc5000;
  }

  /* burst stars */
  .burst-star {
    position: absolute;
    font-size: 1.4rem;
    pointer-events: none;
    animation: burstOut 0.9s ease forwards;
  }

  @keyframes burstOut {
    0%   { transform: translate(0,0) scale(0);   opacity: 1; }
    100% { transform: translate(var(--tx), var(--ty)) scale(1.3); opacity: 0; }
  }

  /* ——— FLOATING BG ——— */
  .floaters {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 0;
    overflow: hidden;
  }

  .floater {
    position: absolute;
    animation: floatUp linear infinite;
    opacity: 0.18;
    font-size: 2rem;
    user-select: none;
  }

  @keyframes floatUp {
    0%   { transform: translateY(110vh) rotate(0deg);   opacity: 0;    }
    10%  { opacity: 0.18; }
    90%  { opacity: 0.18; }
    100% { transform: translateY(-10vh) rotate(360deg); opacity: 0;    }
  }

  /* ——— DECO UNICORNS ——— */
  .unicorn-deco {
    display: flex;
    justify-content: center;
    gap: 30px;
    flex-wrap: wrap;
    margin: 10px auto 0;
    padding: 0 20px;
  }

  .unicorn-deco svg {
    width: 110px;
    height: 110px;
    animation: bounce 2s ease-in-out infinite;
    filter: drop-shadow(2px 3px 0px rgba(0,0,0,0.1));
  }

  .unicorn-deco svg:nth-child(2) { animation-delay: 0.4s; }
  .unicorn-deco svg:nth-child(3) { animation-delay: 0.8s; }

  @keyframes bounce {
    0%,100% { transform: translateY(0) rotate(-3deg);  }
    50%      { transform: translateY(-12px) rotate(3deg); }
  }

  /* ——— GRID ——— */
  .grid-wrap {
    position: relative;
    z-index: 1;
    max-width: 1100px;
    margin: 30px auto 60px;
    padding: 0 16px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 14px;
  }

  .card {
    background: white;
    border-radius: 18px;
    padding: 14px 10px 12px;
    text-align: center;
    border: 2.5px solid transparent;
    box-shadow: 3px 4px 0 rgba(0,0,0,0.08);
    transition: transform 0.2s, box-shadow 0.2s;
    position: relative;
    overflow: hidden;
    cursor: default;
  }

  .card::before {
    content: '';
    position: absolute;
    inset: 3px;
    border-radius: 14px;
    border: 2px dashed rgba(255,110,180,0.3);
    pointer-events: none;
  }

  .card:hover {
    transform: translateY(-5px) rotate(1deg);
    box-shadow: 5px 8px 0 rgba(255,62,154,0.15);
  }

  .card:nth-child(5n+1) { border-color: var(--pink); }
  .card:nth-child(5n+2) { border-color: var(--purple); }
  .card:nth-child(5n+3) { border-color: var(--sky); }
  .card:nth-child(5n+4) { border-color: #ffcc00; }
  .card:nth-child(5n+5) { border-color: var(--mint); }

  .card .heart {
    font-size: 1.6rem;
    display: block;
    animation: heartbeat 1.5s ease-in-out infinite;
    line-height: 1;
  }

  @keyframes heartbeat {
    0%,100% { transform: scale(1);    }
    30%      { transform: scale(1.25); }
    50%      { transform: scale(1.1);  }
  }

  .card .phrase {
    font-family: 'Nunito', sans-serif;
    font-weight: 700;
    font-size: 1.05rem;
    color: #c0006a;
    margin: 4px 0 2px;
    line-height: 1.2;
  }

  .card .lang {
    font-family: 'Nunito', sans-serif;
    font-size: 0.72rem;
    color: #aaa;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  footer {
    position: relative;
    z-index: 1;
    text-align: center;
    padding: 20px;
    font-family: 'Fredoka One', sans-serif;
    color: var(--purple);
    font-size: 1.3rem;
  }
</style>
</head>

/* ——— BURST EFFECT ——— */
function spawnBurst(box) {
  const chars = ['⭐','✨','💫','💖','🌟','💕','🌈','🦄'];
  for (let i = 0; i < 10; i++) {
    const s = document.createElement('span');
    s.className = 'burst-star';
    const angle = (i / 10) * 360;
    const dist  = 70 + Math.random() * 50;
    s.style.setProperty('--tx', Math.cos(angle * Math.PI / 180) * dist + 'px');
    s.style.setProperty('--ty', Math.sin(angle * Math.PI / 180) * dist + 'px');
    s.style.left = '50%';
    s.style.top  = '40%';
    s.textContent = rnd(chars);
    s.style.animationDuration = (0.5 + Math.random() * 0.5) + 's';
    box.appendChild(s);
    setTimeout(() => s.remove(), 1200);
  }
}

  overlay.classList.add('show');
  setTimeout(() => spawnBurst(box), 60);
});

});

overlay.addEventListener('click', e => {
  if (e.target === overlay) overlay.classList.remove('show');
});
